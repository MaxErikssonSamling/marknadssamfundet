name: Bygg och publicera Marknadssamfundet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta webbplatsen
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bygg webbplatsen
        run: python tools/build_site.py

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp byggd webbplats
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
