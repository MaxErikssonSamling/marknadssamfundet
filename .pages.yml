media:
  - name: article_images
    label: Bilder
    input: assets/uploads
    output: /assets/uploads
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

  - name: documents
    label: Dokument och PDF
    input: assets/documents
    output: /assets/documents
    extensions: [pdf]
    categories: [document]
    rename: safe

content:
 content:
  - name: analyses
    label: Analyser
    type: collection
    path: content/articles
    format: json

    filename:
      template: "{year}-{month}-{day}-{primary}.json"
      field: false

    operations:
      create: true
      rename: false
      delete: true

    view:
      fields: [title, published, publish_date, topic, author]
      primary: title
      sort: [publish_date, title]
      search: [title, excerpt, author, topic, tags]
      default:
        sort: publish_date
        order: desc

    fields:
      - name: published
        label: Publicerad
        type: boolean
        default: false
        description: "Av = utkast. Slå på och spara när analysen ska publiceras på webbplatsen."

      - name: title
        label: Rubrik
        type: string
        required: true

      - name: publish_date
        label: Publiceringsdatum
        type: date
        required: true

      - name: type
        label: Publikationstyp
        type: select
        required: true
        default: Analys
        options:
          values: [Analys]

      - name: topic
        label: Rättsområde
        type: select
        required: true
        options:
          values:
            - EU-rätt
            - Svensk affärsrätt

      - name: author
        label: Författare
        type: string
        required: true
        default: Max Eriksson

      - name: excerpt
        label: Ingress
        type: text
        required: true

      - name: hero_image
        label: Bild
        type: image
        options:
          media: article_images
        description: "Valfritt. Använd endast bild när den tillför något till analysen."

      - name: hero_alt
        label: Bildbeskrivning
        type: text
        description: "Fylls i om analysen har en bild."

      - name: tags
        label: Sökord
        type: string
        list: true
        description: "Valfritt. Exempel: inre marknaden, konkurrens, avtalsrätt."

      - name: body
        label: Analystext
        type: rich-text
        required: true
        options:
          format: html
          media: article_images
